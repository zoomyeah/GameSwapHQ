<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameSwapHQ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet"
>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #121212;
        color: #f1f1f1;
    }

    /* ============================================================
       HEADER
       ============================================================ */

    header {
        background: #276221;
        color: white;
        padding: 20px 30px;
        text-align: center;
    }

    header h1 {
        font-family: "Nunito", sans-serif;
        font-weight: 900;
        margin: 0;
        font-size: 3.5rem;
    }

    header p {
        margin: 8px 0 0;
        font-size: 1.05rem;
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */

    nav {
        background: #1b1b1b;
        padding: 12px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    nav a {
        color: #6fcf68;
        text-decoration: none;
        margin: 0 15px;
        font-weight: bold;
        cursor: pointer;
    }

    nav a:hover {
        text-decoration: underline;
    }

    /* ============================================================
       MAIN
       ============================================================ */

    main {
        max-width: 1100px;
        margin: auto;
        padding: 40px 20px;
    }

    /* ============================================================
       PAGES
       ============================================================ */

    .page {
        display: none;
    }

    .page.active {
        display: block;
    }

    /* ============================================================
       HOME
       ============================================================ */

    .hero {
        text-align: center;
        padding: 50px 20px;
    }

    .hero h2 {
        font-size: 2.2rem;
        margin-bottom: 15px;
    }

    .hero p {
        max-width: 650px;
        margin: auto;
        font-size: 1.1rem;
        line-height: 1.6;
        color: #cfcfcf;
    }

    /* ============================================================
       SECTIONS
       ============================================================ */

    .section {
        margin-top: 50px;
    }

    .section h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    /* ============================================================
       GAMES GRID
       ============================================================ */

    .games-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
    }

    @media (max-width: 800px) {

        .games-grid {
            grid-template-columns: repeat(2, 1fr);
        }

    }

    @media (max-width: 550px) {

        .games-grid {
            grid-template-columns: 1fr;
        }

    }

    /* ============================================================
       GAME CARD
       ============================================================ */

    .game-card {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid #2c2c2c;
        background: #1e1e1e;
        box-shadow: 0 3px 12px rgba(0,0,0,0.5);
        cursor: pointer;
        transition:
            transform 0.2s,
            box-shadow 0.2s;
    }

    .game-card:hover {
        transform: translateY(-4px);

        box-shadow:
            0 6px 20px rgba(0,0,0,0.6),
            0 0 15px rgba(111,207,104,0.15);
    }

    /* ============================================================
       THUMBNAILS
       ============================================================ */

    .game-thumbnail-container {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #080808;
        position: relative;
        overflow: hidden;
    }

    .game-thumbnail {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    .game-thumbnail-overlay {
        position: absolute;
        inset: 0;

        background: linear-gradient(
            to bottom,
            rgba(0,0,0,0),
            rgba(0,0,0,0.15) 40%,
            rgba(0,0,0,0.9) 100%
        );
    }

    /* ============================================================
       CARD TEXT
       ============================================================ */

    .game-card-content {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;

        padding: 20px;

        text-align: center;

        z-index: 2;
    }

    .game-card h3 {
        margin: 0 0 3px;

        font-family: "Nunito", sans-serif;
        font-size: 1.6rem;
        font-weight: 900;

        text-shadow:
            0 0 5px #000,
            0 0 10px #000,
            0 0 20px #000,
            0 2px 4px #000;
    }

    .game-card p {
        margin: 0;

        color: white;
        font-size: 0.9rem;

        text-shadow:
            0 0 5px #000,
            0 0 10px #000,
            0 2px 4px #000;
    }

    /* ============================================================
       SEARCH
       ============================================================ */

    .game-search {
        width: 100%;
        max-width: 600px;

        display: block;

        margin: 0 auto 35px;

        padding: 14px 18px;

        border-radius: 10px;
        border: 1px solid #333;

        background: #1e1e1e;
        color: white;

        font-size: 1.05rem;

        outline: none;

        box-shadow:
            0 3px 12px rgba(0,0,0,0.4);
    }

    .game-search:focus {
        border-color: #6fcf68;

        box-shadow:
            0 0 10px rgba(111,207,104,0.25);
    }

    .no-games {
        text-align: center;
        color: #aaa;
        padding: 30px;
        display: none;
    }

    /* ============================================================
       SUBMIT BOX
       ============================================================ */

    .submit-box {
        background: #1e1e1e;
        border-radius: 12px;

        padding: 30px;

        text-align: center;

        box-shadow:
            0 3px 12px rgba(0,0,0,0.4);

        border: 1px solid #2c2c2c;
    }

    .submit-box p {
        color: #cfcfcf;
        line-height: 1.6;
    }

    /* ============================================================
       GAME PAGE
       ============================================================ */

    .back-button {
        display: inline-flex;

        align-items: center;
        gap: 8px;

        background: #1e1e1e;
        color: white;

        border: 1px solid #333;
        border-radius: 8px;

        padding: 10px 16px;

        cursor: pointer;

        font-size: 1rem;

        margin-bottom: 30px;
    }

    .back-button:hover {
        background: #292929;
    }

    .game-title {
        text-align: center;

        font-family: "Nunito", sans-serif;

        font-size: 3rem;
        font-weight: 900;

        margin: 10px 0;
    }

    .game-info {
        text-align: center;

        color: #aaa;

        margin-bottom: 25px;
    }

    /* ============================================================
       GAME PAGE THUMBNAIL
       ============================================================ */

    .game-page-thumbnail {
        width: 100%;
        max-width: 900px;

        margin: 25px auto 30px;

        border-radius: 16px;

        overflow: hidden;

        background: #080808;

        position: relative;

        box-shadow:
            0 0 20px #03045e,
            0 0 40px #03045e;
    }

    .game-page-thumbnail img {
        width: 100%;
        height: auto;

        display: block;
    }

    /* ============================================================
       PLAY AREA
       ============================================================ */

    .play-area {
        text-align: center;
    }

    /* ============================================================
       GAME CONTROLS
       ============================================================ */

    .game-controls {
        display: flex;

        justify-content: center;
        align-items: center;

        gap: 12px;

        margin-bottom: 25px;
    }

    .play-button {
        background: #276221;

        color: white;

        border: none;

        border-radius: 8px;

        padding: 13px 28px;

        cursor: pointer;

        font-size: 1.15rem;

        font-weight: bold;
    }

    .play-button:hover {
        background: #347c2e;
    }

    /* ============================================================
       GAME FRAME
       ============================================================ */

    .game-frame-container {
        display: none;

        width: 100%;

        max-width: 1000px;

        margin: 0 auto;

        padding: 8px;

        border-radius: 16px;

        background: #03045e;

        box-shadow:
            0 0 20px #03045e,
            0 0 45px #03045e;

        position: relative;
    }

    .game-frame-container:fullscreen {
        max-width: none;

        width: 100vw;
        height: 100vh;

        padding: 0;

        border-radius: 0;

        background: #000;
    }

    .game-frame-container:fullscreen .game-frame {
        width: 100vw;
        height: 100vh;

        border-radius: 0;
    }

    .game-frame {
        display: block;

        width: 100%;
        height: 650px;

        border: none;

        border-radius: 10px;

        background: #000;
    }

    /* ============================================================
       GAMEPLAY BAR
       ============================================================ */

    .gameplay-bar {
        position: absolute;

        left: 8px;
        right: 8px;
        bottom: 8px;

        height: 42px;

        background: rgba(13,13,13,0.94);

        border-radius: 0 0 10px 10px;

        display: flex;

        align-items: center;

        padding: 0 10px;

        z-index: 10;

        backdrop-filter: blur(6px);

        box-shadow:
            0 -3px 12px rgba(0,0,0,0.35);

        transition:
            opacity 0.2s,
            transform 0.2s;
    }

    /* Small game name */

    .gameplay-name {
        color: #aaa;

        font-size: 0.78rem;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;

        max-width: 40%;
    }

    /* Right side controls */

    .gameplay-controls {
        margin-left: auto;

        display: flex;

        align-items: center;

        gap: 7px;
    }

    .gameplay-button {
        width: 30px;
        height: 30px;

        display: flex;

        align-items: center;
        justify-content: center;

        border: none;

        border-radius: 6px;

        background: transparent;

        color: #ccc;

        cursor: pointer;

        font-size: 18px;

        padding: 0;

        transition:
            background 0.15s,
            color 0.15s;
    }

    .gameplay-button:hover {
        background: #292929;
        color: white;
    }

    .like-button {
        font-size: 19px;
    }

    .fullscreen-button {
        font-size: 20px;
    }

    /* ============================================================
       HIDE BAR BUTTON
       ============================================================ */

    .hide-bar-button {
        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        background: rgba(20,20,20,0.85);

        color: #ddd;

        border: 1px solid #444;

        border-radius: 6px;

        padding: 7px 13px;

        font-size: 0.8rem;

        cursor: pointer;

        display: none;

        z-index: 20;
    }

    .hide-bar-button:hover {
        background: rgba(45,45,45,0.95);
        color: white;
    }

    /* ============================================================
       HIDDEN GAMEPLAY BAR
       ============================================================ */

    .gameplay-bar.hidden {
        opacity: 0;
        pointer-events: none;

        transform: translateY(10px);
    }

    /* ============================================================
       FULLSCREEN GAMEPLAY BAR
       ============================================================ */

    .game-frame-container:fullscreen .gameplay-bar {
        left: 0;
        right: 0;
        bottom: 0;

        border-radius: 0;

        height: 44px;
    }

    .game-frame-container:fullscreen .hide-bar-button {
        display: block;
    }

    .game-frame-container:fullscreen .gameplay-bar.hidden {
        opacity: 0;
    }

    /* ============================================================
       FOOTER
       ============================================================ */

    footer {
        margin-top: 60px;

        padding: 25px 30px;

        text-align: center;

        background: #0d0d0d;

        color: #aaa;
    }

    footer p {
        margin: 0 0 12px;
    }

    .footer-links {
        display: flex;

        justify-content: space-between;
        align-items: center;

        max-width: 1100px;

        margin: 0 auto;
    }

    .footer-links a {
        color: #6fcf68;

        text-decoration: none;

        font-weight: bold;
    }

    .footer-links a:hover {
        text-decoration: underline;
    }

</style>

    <main>

        <button

        </button>

            class="game-title"

        </h1>

        </div>

                id="game-thumbnail"
                src=""
                alt="Game thumbnail"
            >

            <button

                id="thumbnail-play-button"
                onclick="playGame()"
                style="

                    z-index:5;
                "
            >

    </p>

        >

<script>


    /* ============================================================
       GAME LIST
       ============================================================ */

    const games = [

        {
            id: "Gravi-Plat",
            name: "Gravi-Plat",
            creator: "zoomyeah",
            date: "August 10, 2026"
        }

    ];


    /* ============================================================
       PAGE NAVIGATION
       ============================================================ */

    function showPage(pageID) {

        document
            .querySelectorAll(".page")
            .forEach(page => {

                page.classList.remove("active");

            });


        const page =
            document.getElementById(pageID);


        if (page) {

            page.classList.add("active");

        }


        window.scrollTo(0, 0);


        if (pageID !== "game-page") {

            history.pushState(
                null,
                "",
                pageID === "home-page"
                    ? "#home"
                    : "#" +
                      pageID.replace("-page", "")
            );

        }

    }


    /* ============================================================
       CREATE GAME CARDS
       ============================================================ */

    function createGameCards(gameList = games) {

        const gamesList =
            document.getElementById("games-list");


        gamesList.innerHTML = "";


        const noGames =
            document.getElementById("no-games");


        if (gameList.length === 0) {

            noGames.style.display = "block";

            return;

        }


        noGames.style.display = "none";


        gameList.forEach(game => {


            const card =
                document.createElement("div");


            card.className =
                "game-card";


            card.onclick =
                function() {

                    openGame(game.id);

                };


            const thumbnailContainer =
                document.createElement("div");


            thumbnailContainer.className =
                "game-thumbnail-container";


            const thumbnail =
                document.createElement("img");


            thumbnail.className =
                "game-thumbnail";


            thumbnail.src =
                "/game-thumbnail/" +
                game.id;


            thumbnail.alt =
                game.name +
                " thumbnail";


            const overlay =
                document.createElement("div");


            overlay.className =
                "game-thumbnail-overlay";


            const content =
                document.createElement("div");


            content.className =
                "game-card-content";


            const title =
                document.createElement("h3");


            title.textContent =
                game.name;


            const creator =
                document.createElement("p");


            creator.textContent =
                "by " +
                game.creator +
                " · " +
                game.date;


            content.appendChild(title);

            content.appendChild(creator);


            thumbnailContainer.appendChild(
                thumbnail
            );


            thumbnailContainer.appendChild(
                overlay
            );


            thumbnailContainer.appendChild(
                content
            );


            card.appendChild(
                thumbnailContainer
            );


            gamesList.appendChild(card);

        });

    }


    /* ============================================================
       SEARCH
       ============================================================ */

    function searchGames() {

        const search =
            document
                .getElementById("game-search")
                .value
                .toLowerCase()
                .trim();


        const filtered =
            games.filter(game =>

                game.name
                    .toLowerCase()
                    .includes(search)

                ||

                game.creator
                    .toLowerCase()
                    .includes(search)

            );


        createGameCards(filtered);

    }


    /* ============================================================
       CURRENT GAME
       ============================================================ */

    let currentGame = null;


    /* ============================================================
       OPEN GAME
       ============================================================ */

    function openGame(gameID) {

        const game =
            games.find(
                game => game.id === gameID
            );


        if (!game) {

            return;

        }


        currentGame =
            game;


        document
            .querySelectorAll(".page")
            .forEach(page => {

                page.classList.remove("active");

            });


        document
            .getElementById("game-page")
            .classList.add("active");


        document
            .getElementById("game-title")
            .textContent =
                game.name;


        document
            .getElementById("game-info")
            .textContent =
                "Created by " +
                game.creator +
                " · Released " +
                game.date;


        const thumbnail =
            document
                .getElementById("game-thumbnail");


        thumbnail.src =
            "/game-thumbnail/" +
            game.id;


        thumbnail.alt =
            game.name +
            " thumbnail";


        document
            .getElementById("gameplay-name")
            .textContent =
                game.name;


        resetGame();


        history.pushState(
            null,
            "",
            "#game-" +
            game.id
        );


        window.scrollTo(0, 0);

    }


    /* ============================================================
       RESET GAME
       ============================================================ */

    function resetGame() {

        const frame =
            document.getElementById(
                "game-frame"
            );


        const container =
            document.getElementById(
                "game-frame-container"
            );


        const thumbnail =
            document.getElementById(
                "game-page-thumbnail"
            );


        const thumbnailPlay =
            document.getElementById(
                "thumbnail-play-button"
            );


        const bar =
            document.getElementById(
                "gameplay-bar"
            );


        frame.src = "";


        container.style.display =
            "none";


        thumbnail.style.display =
            "block";


        thumbnailPlay.style.display =
            "block";


        bar.classList.remove(
            "hidden"
        );


        if (document.fullscreenElement) {

            document.exitFullscreen();

        }

    }


    /* ============================================================
       PLAY GAME
       ============================================================ */

    function playGame() {

        if (!currentGame) {

            return;

        }


        const frame =
            document.getElementById(
                "game-frame"
            );


        const container =
            document.getElementById(
                "game-frame-container"
            );


        const thumbnail =
            document.getElementById(
                "game-page-thumbnail"
            );


        const thumbnailPlay =
            document.getElementById(
                "thumbnail-play-button"
            );


        const bar =
            document.getElementById(
                "gameplay-bar"
            );


        frame.src =
            "/game/" +
            currentGame.id;


        frame.title =
            currentGame.name;


        container.style.display =
            "block";


        thumbnail.style.display =
            "none";


        thumbnailPlay.style.display =
            "none";


        bar.classList.remove(
            "hidden"
        );

    }


    /* ============================================================
       FULLSCREEN
       ============================================================ */

    function toggleFullscreen() {

        const container =
            document.getElementById(
                "game-frame-container"
            );


        if (!document.fullscreenElement) {

            container.requestFullscreen();

        }

        else {

            document.exitFullscreen();

        }

    }


    /* ============================================================
       LIKE
       ============================================================ */

    function likeGame() {

        const button =
            document.getElementById(
                "like-button"
            );


        if (button.textContent === "♡") {

            button.textContent = "♥";

        }

        else {

            button.textContent = "♡";

        }

    }


    /* ============================================================
       HIDE / SHOW GAMEPLAY BAR
       ============================================================ */

    function toggleGameBar() {

        const bar =
            document.getElementById(
                "gameplay-bar"
            );


        bar.classList.toggle(
            "hidden"
        );

    }


    /* ============================================================
       HASH NAVIGATION
       ============================================================ */

    function checkHash() {

        const hash =
            window.location.hash;


        if (hash.startsWith("#game-")) {

            const gameID =
                hash.substring(6);


            const game =
                games.find(
                    game => game.id === gameID
                );


            if (game) {

                openGameWithoutHistory(
                    game
                );

                return;

            }

        }


        if (hash === "#games") {

            showPageWithoutHistory(
                "games-page"
            );

            return;

        }


        showPageWithoutHistory(
            "home-page"
        );

    }


    /* ============================================================
       SHOW PAGE WITHOUT HISTORY
       ============================================================ */

    function showPageWithoutHistory(pageID) {

        document
            .querySelectorAll(".page")
            .forEach(page => {

                page.classList.remove("active");

            });


        document
            .getElementById(pageID)
            .classList.add("active");


        window.scrollTo(0, 0);

    }


    /* ============================================================
       OPEN GAME WITHOUT HISTORY
       ============================================================ */

    function openGameWithoutHistory(game) {

        currentGame =
            game;


        showPageWithoutHistory(
            "game-page"
        );


        document
            .getElementById("game-title")
            .textContent =
                game.name;


        document
            .getElementById("game-info")
            .textContent =
                "Created by " +
                game.creator +
                " · Released " +
                game.date;


        const thumbnail =
            document.getElementById(
                "game-thumbnail"
            );


        thumbnail.src =
            "/game-thumbnail/" +
            game.id;


        thumbnail.alt =
            game.name +
            " thumbnail";


        document
            .getElementById("gameplay-name")
            .textContent =
                game.name;


        resetGame();

    }


    /* ============================================================
       START
       ============================================================ */

    createGameCards();


    window.addEventListener(
        "popstate",
        checkHash
    );


    window.addEventListener(
        "hashchange",
        checkHash
    );


    checkHash();


</script>
